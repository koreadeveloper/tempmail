<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TempMail logo">
  <title>TempMail — 1시간 임시 이메일</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square tile -->
  <rect width="512" height="512" rx="24" fill="url(#bg)"/>
  <!-- Envelope body -->
  <rect x="116" y="168" width="280" height="184" rx="24" fill="none" stroke="#ffffff" stroke-width="28"/>
  <!-- Envelope flap -->
  <path d="M130 184 L256 290 L382 184" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Clock badge: time-limited mail -->
  <circle cx="398" cy="372" r="56" fill="#ffffff"/>
  <path d="M398 344 L398 372 L424 372" fill="none" stroke="#6366f1" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
